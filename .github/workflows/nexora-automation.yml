name: NEXORA AI Automation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NEXORA automation
        run: |
          test -n "${{ secrets.CRON_SECRET }}"
          FINGERPRINT=$(printf '%s' "${{ secrets.CRON_SECRET }}" | sha256sum | cut -c1-12)
          echo "GitHub CRON_SECRET fingerprint: $FINGERPRINT"
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://nexora-ai-two-delta.vercel.app/api/automation
