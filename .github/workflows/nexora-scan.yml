name: NEXORA Scanner

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger NEXORA scanner
        env:
          NEXORA_URL: ${{ secrets.NEXORA_PRODUCTION_URL }}
          NEXORA_CRON_SECRET: ${{ secrets.NEXORA_CRON_SECRET }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${NEXORA_CRON_SECRET}" \
            "${NEXORA_URL}/api/automation/scan"
